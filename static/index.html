<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncBoard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<main x-data="syncBoard()" x-init="init()" class="min-h-screen">
  <section x-show="!token" class="flex min-h-screen items-center justify-center p-6">
    <div class="w-full max-w-md rounded-2xl bg-slate-900 p-8 shadow-2xl ring-1 ring-slate-800">
      <h1 class="text-3xl font-bold text-cyan-400">SyncBoard</h1>
      <p class="mt-2 text-slate-400">Collaborate on your work in real time.</p>
      <div x-show="mode !== 'forgot' && mode !== 'reset'" class="mt-6 flex rounded-lg bg-slate-800 p-1">
        <button @click="mode='login'" :class="mode==='login' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'" class="flex-1 rounded-md py-2 font-semibold">Login</button>
        <button @click="mode='register'" :class="mode==='register' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'" class="flex-1 rounded-md py-2 font-semibold">Register</button>
      </div>
      <form x-show="mode === 'login' || mode === 'register'" @submit.prevent="submitAuth" class="mt-6 space-y-4">
        <input x-model="auth.email" type="email" placeholder="Email" required class="w-full rounded-lg bg-slate-800 px-4 py-3 outline-none ring-cyan-400 focus:ring-2">
        <input x-show="mode==='register'" x-model="auth.username" type="text" placeholder="Username" :required="mode==='register'" class="w-full rounded-lg bg-slate-800 px-4 py-3 outline-none ring-cyan-400 focus:ring-2">
        <div class="relative">
          <input x-model="auth.password" :type="showPassword ? 'text' : 'password'" placeholder="Password (8+ characters)" autocomplete="current-password" required class="w-full rounded-lg bg-slate-800 px-4 py-3 pr-12 outline-none ring-cyan-400 focus:ring-2">
          <button type="button" @click="showPassword = !showPassword" :aria-label="showPassword ? 'Hide password' : 'Show password'" class="absolute inset-y-0 right-0 px-4 text-slate-400 hover:text-cyan-300">
            <svg x-show="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.644C3.423 7.51 7.36 4.5 12 4.5c4.64 0 8.577 3.01 9.964 7.178.07.21.07.434 0 .644C20.577 16.49 16.64 19.5 12 19.5c-4.64 0-8.577-3.01-9.964-7.178Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
            <svg x-show="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.94 0 1.85-.13 2.71-.37M6.228 6.228A10.45 10.45 0 0 1 12 4.5c4.756 0 8.774 3.162 10.066 7.5a10.523 10.523 0 0 1-4.293 5.146M6.228 6.228 3 3m3.228 3.228 3.06 3.06m8.484 8.484L21 21m-3.228-3.228-3.06-3.06m0 0a3 3 0 1 1-4.243-4.243m4.242 4.242L9.47 9.47" /></svg>
          </button>
        </div>
        <button class="w-full rounded-lg bg-cyan-500 py-3 font-bold text-slate-950 hover:bg-cyan-400" x-text="mode==='login' ? 'Sign in' : 'Create account'"></button>
      </form>
      <button x-show="mode === 'login'" @click="mode='forgot'; error=''" type="button" class="mt-4 w-full text-sm text-cyan-400 hover:text-cyan-300">Forgot your password?</button>
      <form x-show="mode === 'forgot'" @submit.prevent="requestReset" class="mt-6 space-y-4">
        <h2 class="text-xl font-semibold">Reset your password</h2>
        <p class="text-sm text-slate-400">Enter your email and we will send a reset link if an account exists.</p>
        <input x-model="resetEmail" type="email" placeholder="Email" required class="w-full rounded-lg bg-slate-800 px-4 py-3 outline-none ring-cyan-400 focus:ring-2">
        <button class="w-full rounded-lg bg-cyan-500 py-3 font-bold text-slate-950 hover:bg-cyan-400">Send reset link</button>
        <button @click="mode='login'; error=''" type="button" class="w-full text-sm text-slate-400 hover:text-white">Back to login</button>
      </form>
      <form x-show="mode === 'reset'" @submit.prevent="resetPassword" class="mt-6 space-y-4">
        <h2 class="text-xl font-semibold">Choose a new password</h2>
        <div class="relative">
          <input x-model="newPassword" :type="showResetPassword ? 'text' : 'password'" placeholder="New password (8+ characters)" autocomplete="new-password" required class="w-full rounded-lg bg-slate-800 px-4 py-3 pr-12 outline-none ring-cyan-400 focus:ring-2">
          <button type="button" @click="showResetPassword = !showResetPassword" :aria-label="showResetPassword ? 'Hide password' : 'Show password'" class="absolute inset-y-0 right-0 px-4 text-slate-400 hover:text-cyan-300">◉</button>
        </div>
        <input x-model="confirmPassword" type="password" placeholder="Confirm new password" autocomplete="new-password" required class="w-full rounded-lg bg-slate-800 px-4 py-3 outline-none ring-cyan-400 focus:ring-2">
        <button class="w-full rounded-lg bg-cyan-500 py-3 font-bold text-slate-950 hover:bg-cyan-400">Set new password</button>
      </form>
      <p x-show="error" x-text="error" class="mt-4 rounded-lg bg-red-950 p-3 text-sm text-red-300"></p>
      <p x-show="success" x-text="success" class="mt-4 rounded-lg bg-emerald-950 p-3 text-sm text-emerald-300"></p>
    </div>
  </section>

  <section x-show="token" class="min-h-screen">
    <header class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 bg-slate-900 px-6 py-4">
      <div><span class="text-xl font-bold text-cyan-400">SyncBoard</span><span class="ml-3 text-sm text-slate-400" x-text="user?.username"></span></div>
      <div class="flex items-center gap-2">
        <button @click="showChangePassword = !showChangePassword" class="rounded-lg px-3 py-2 text-sm text-slate-400 hover:bg-slate-800 hover:text-white">Change password</button>
        <button @click="logout" class="rounded-lg px-3 py-2 text-sm text-slate-400 hover:bg-slate-800 hover:text-white">Log out</button>
      </div>
    </header>
    <div x-show="showChangePassword" class="mx-auto max-w-7xl px-6 pt-6">
      <form @submit.prevent="changePassword" class="rounded-2xl bg-slate-900 p-5">
        <h2 class="font-semibold">Change password</h2>
        <div class="mt-3 grid gap-3 md:grid-cols-3">
          <input x-model="change.current" type="password" placeholder="Current password" required class="rounded-lg bg-slate-800 px-3 py-2 outline-none">
          <input x-model="change.next" type="password" placeholder="New password (8+ characters)" required class="rounded-lg bg-slate-800 px-3 py-2 outline-none">
          <input x-model="change.confirm" type="password" placeholder="Confirm new password" required class="rounded-lg bg-slate-800 px-3 py-2 outline-none">
        </div>
        <button class="mt-3 rounded-lg bg-cyan-500 px-4 py-2 font-semibold text-slate-950">Update password</button>
      </form>
    </div>
    <p x-show="success" x-text="success" class="mx-auto max-w-7xl px-6 pt-4 text-sm text-emerald-400"></p>
    <div class="mx-auto flex max-w-7xl flex-col gap-6 p-6 lg:flex-row">
      <aside class="w-full shrink-0 rounded-2xl bg-slate-900 p-5 lg:w-72">
        <h2 class="font-semibold">Your boards</h2>
        <div class="mt-3 space-y-2">
          <template x-for="board in boards" :key="board.id">
            <button @click="selectBoard(board.id)" class="block w-full rounded-lg px-3 py-2 text-left hover:bg-slate-800" :class="activeBoard?.id===board.id ? 'bg-cyan-950 text-cyan-300' : 'text-slate-300'" x-text="board.title"></button>
          </template>
        </div>
        <form @submit.prevent="createBoard" class="mt-5 flex gap-2">
          <input x-model="newBoard" placeholder="New board..." class="min-w-0 flex-1 rounded-lg bg-slate-800 px-3 py-2 text-sm outline-none">
          <button class="rounded-lg bg-cyan-500 px-3 font-bold text-slate-950">+</button>
        </form>
        <form x-show="activeBoard" @submit.prevent="invite" class="mt-5 border-t border-slate-800 pt-5">
          <label class="text-sm text-slate-400">Invite member</label>
          <div class="mt-2 flex gap-2">
            <input x-model="inviteEmail" type="email" placeholder="email@example.com" required class="min-w-0 flex-1 rounded-lg bg-slate-800 px-3 py-2 text-sm outline-none">
            <button class="rounded-lg bg-slate-700 px-3 text-sm">Send</button>
          </div>
        </form>
        <div x-show="activeBoard" class="mt-5 border-t border-slate-800 pt-5">
          <h3 class="text-sm font-semibold text-slate-300">Board contributors</h3>
          <ul class="mt-3 space-y-3">
            <template x-for="member in members" :key="member.id">
              <li class="flex items-center gap-3">
                <span class="flex h-8 w-8 items-center justify-center rounded-full bg-cyan-950 text-sm font-semibold text-cyan-300" x-text="member.username.charAt(0).toUpperCase()"></span>
                <div class="min-w-0">
                  <p class="truncate text-sm text-slate-200" x-text="member.username"></p>
                  <p class="truncate text-xs text-slate-500" x-text="member.email"></p>
                </div>
              </li>
            </template>
          </ul>
        </div>
      </aside>
      <section class="min-w-0 flex-1">
        <div x-show="!activeBoard" class="rounded-2xl bg-slate-900 p-10 text-center text-slate-400">Create or select a board to begin.</div>
        <template x-if="activeBoard">
          <div>
            <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
              <h2 class="text-2xl font-bold" x-text="activeBoard.title"></h2>
              <form @submit.prevent="createTask" class="flex gap-2">
                <input x-model="newTask" required placeholder="Add a task..." class="rounded-lg bg-slate-900 px-4 py-2 outline-none ring-cyan-400 focus:ring-2">
                <button class="rounded-lg bg-cyan-500 px-4 font-semibold text-slate-950">Add</button>
              </form>
            </div>
            <p x-show="error" x-text="error" class="mb-4 rounded-lg bg-red-950 p-3 text-sm text-red-300"></p>
            <div class="grid gap-4 md:grid-cols-3">
              <template x-for="column in columns" :key="column.status">
                <div class="min-h-96 rounded-2xl bg-slate-900 p-4">
                  <h3 class="mb-4 flex items-center justify-between font-semibold">
                    <span x-text="column.label"></span>
                    <span class="rounded-full bg-slate-800 px-2 py-1 text-xs" x-text="tasks.filter(t => t.status===column.status).length"></span>
                  </h3>
                  <div class="space-y-3">
                    <template x-for="task in tasks.filter(t => t.status===column.status)" :key="task.id">
                      <article class="rounded-xl bg-slate-800 p-4">
                        <h4 class="font-medium" x-text="task.title"></h4>
                        <p x-show="task.description" class="mt-2 text-sm text-slate-400" x-text="task.description"></p>
                        <div class="mt-4 flex items-center justify-between">
                          <div class="flex gap-1">
                            <button @click="move(task, -1)" x-show="column.status!=='TODO'" class="rounded bg-slate-700 px-2 py-1 text-xs">←</button>
                            <button @click="move(task, 1)" x-show="column.status!=='DONE'" class="rounded bg-slate-700 px-2 py-1 text-xs">→</button>
                          </div>
                          <button @click="removeTask(task)" class="text-xs text-red-400 hover:text-red-300">Delete</button>
                        </div>
                      </article>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </section>
    </div>
  </section>
</main>
<script>
function syncBoard() {
  return {
    token: localStorage.getItem('syncboard_token'),
    user: null, boards: [], activeBoard: null, members: [], tasks: [], socket: null,
    mode: new URLSearchParams(location.search).has('reset_token') ? 'reset' : 'login',
    resetToken: new URLSearchParams(location.search).get('reset_token') || '',
    resetEmail: '', newPassword: '', confirmPassword: '', showPassword: false, showResetPassword: false,
    showChangePassword: false, success: '', error: '', newBoard: '', newTask: '', inviteEmail: '',
    change: { current: '', next: '', confirm: '' },
    auth: { email: '', username: '', password: '' },
    columns: [{ status: 'TODO', label: 'To Do' }, { status: 'IN_PROGRESS', label: 'In Progress' }, { status: 'DONE', label: 'Done' }],
    async init() { if (this.token) { try { await this.loadUser(); await this.loadBoards(); } catch (_) { this.logout(); } } },
    async request(path, options = {}) {
      const response = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${this.token}`, ...(options.headers || {}) } });
      if (!response.ok) throw new Error((await response.json()).detail || 'Request failed');
      return response.status === 204 ? null : response.json();
    },
    async submitAuth() {
      this.error = ''; this.success = '';
      try {
        if (this.mode === 'register') {
          await fetch('/api/auth/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(this.auth) }).then(async r => { if (!r.ok) throw new Error((await r.json()).detail || 'Registration failed'); });
        }
        const result = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email: this.auth.email, password: this.auth.password }) }).then(async r => { if (!r.ok) throw new Error((await r.json()).detail || 'Login failed'); return r.json(); });
        this.token = result.access_token; localStorage.setItem('syncboard_token', this.token); await this.loadUser(); await this.loadBoards();
      } catch (e) { this.error = e.message; }
    },
    async requestReset() {
      this.error = ''; this.success = '';
      try {
        const response = await fetch('/api/auth/forgot-password', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email: this.resetEmail}) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || 'Unable to request password reset');
        this.success = result.message; this.resetEmail = '';
      } catch (e) { this.error = e.message; }
    },
    async resetPassword() {
      this.error = ''; this.success = '';
      if (this.newPassword !== this.confirmPassword) { this.error = 'Passwords do not match'; return; }
      try {
        const response = await fetch('/api/auth/reset-password', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token: this.resetToken, password: this.newPassword}) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || 'Unable to reset password');
        this.mode = 'login'; this.newPassword = ''; this.confirmPassword = ''; this.resetToken = ''; history.replaceState({}, '', '/'); this.success = result.message;
      } catch (e) { this.error = e.message; }
    },
    async changePassword() {
      this.error = ''; this.success = '';
      if (this.change.next !== this.change.confirm) { this.error = 'Passwords do not match'; return; }
      try {
        const result = await this.request('/api/auth/change-password', { method: 'POST', body: JSON.stringify({current_password: this.change.current, new_password: this.change.next}) });
        this.change = {current: '', next: '', confirm: ''}; this.showChangePassword = false; this.success = result.message;
      } catch (e) { this.error = e.message; }
    },
    async loadUser() { this.user = await this.request('/api/auth/me'); },
    async loadBoards() { this.boards = await this.request('/api/boards/'); if (this.boards.length) await this.selectBoard(this.activeBoard?.id || this.boards[0].id); },
    async createBoard() { try { const board = await this.request('/api/boards/', { method: 'POST', body: JSON.stringify({title: this.newBoard}) }); this.newBoard = ''; this.boards.push(board); await this.selectBoard(board.id); } catch (e) { this.error = e.message; } },
    async selectBoard(id) { if (this.socket) this.socket.close(); this.activeBoard = this.boards.find(b => b.id === id); const detail = await this.request(`/api/boards/${id}`); this.members = detail.members; this.tasks = detail.tasks; const protocol = location.protocol === 'https:' ? 'wss' : 'ws'; this.socket = new WebSocket(`${protocol}://${location.host}/ws/boards/${id}?token=${encodeURIComponent(this.token)}`); this.socket.onmessage = event => this.handleEvent(JSON.parse(event.data)); },
    handleEvent(message) { if (message.event === 'task_deleted') this.tasks = this.tasks.filter(t => t.id !== message.task_id); if (message.event === 'task_created') this.tasks = [...this.tasks.filter(t => t.id !== message.task.id), message.task]; if (message.event === 'task_updated') this.tasks = [...this.tasks.filter(t => t.id !== message.task.id), message.task]; },
    async createTask() { try { const task = await this.request(`/api/boards/${this.activeBoard.id}/tasks`, { method: 'POST', body: JSON.stringify({title: this.newTask}) }); this.handleEvent({event: 'task_created', task}); this.newTask = ''; } catch (e) { this.error = e.message; } },
    async move(task, direction) { const order = this.columns.map(c => c.status), status = order[order.indexOf(task.status) + direction]; try { const updated = await this.request(`/api/boards/${this.activeBoard.id}/tasks/${task.id}`, { method: 'PATCH', body: JSON.stringify({status}) }); this.handleEvent({event: 'task_updated', task: updated}); } catch (e) { this.error = e.message; } },
    async removeTask(task) { try { await this.request(`/api/boards/${this.activeBoard.id}/tasks/${task.id}`, {method: 'DELETE'}); this.handleEvent({event: 'task_deleted', task_id: task.id}); } catch (e) { this.error = e.message; } },
    async invite() { try { const member = await this.request(`/api/boards/${this.activeBoard.id}/members?email=${encodeURIComponent(this.inviteEmail)}`, {method: 'POST'}); this.members = [...this.members, member]; this.inviteEmail = ''; } catch (e) { this.error = e.message; } },
    logout() { if (this.socket) this.socket.close(); localStorage.removeItem('syncboard_token'); this.token = null; this.user = null; this.boards = []; this.activeBoard = null; this.members = []; }
  };
}
</script>
</body>
</html>
